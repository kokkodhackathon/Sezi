# Supabase free tier, 7 gün işlem olmayan projeyi duraklatır. Bu iş her gün bir okuma yaparak bunu önler.
name: supabase-keepalive
on:
  schedule:
    - cron: "17 6 * * *"
  workflow_dispatch:
jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Supabase REST okuması
        run: |
          curl -fsS "${{ secrets.SUPABASE_URL }}/rest/v1/work_types?select=id&limit=1" \
            -H "apikey: ${{ secrets.SUPABASE_ANON_KEY }}" \
            -H "Authorization: Bearer ${{ secrets.SUPABASE_ANON_KEY }}" > /dev/null
