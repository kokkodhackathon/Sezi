# Tek sayfalık uygulama: /noktalar, /rota-testi gibi adresler doğrudan açılınca da index.html döner.
server {
  listen 80;
  root /usr/share/nginx/html;

  # nginx'in tür tablosunda .mjs yok (application/octet-stream döner); tarayıcı modül olarak yüklemeyi reddeder.
  # PDF.js işçisi (pdf.worker.min-*.mjs) bu yüzden JavaScript türüyle sunulur.
  location ~* \.mjs$ {
    types { }
    default_type application/javascript;
    expires 1y;
    add_header Cache-Control "public, immutable";
    try_files $uri =404;
  }

  # Dosya adında içerik özeti olan derleme çıktıları uzun süre önbellekte kalır.
  location /assets/ {
    expires 1y;
    add_header Cache-Control "public, immutable";
    try_files $uri =404;
  }

  # index.html her seferinde yeniden alınır: yeni sürüm hemen görünür.
  location / {
    add_header Cache-Control "no-cache";
    try_files $uri $uri/ /index.html;
  }
}
